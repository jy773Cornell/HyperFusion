# HyperFusion hardware configuration
# Edit this file manually. Values are reloaded on every app start.
# Distances are in millimetres unless noted.

[camera_positions]
# Default stage position for each camera at the white reference reference.
fx10e_mm = 735
swir3_mm = 545
distance_dual_camera_mm = fx10e_mm - swir3_mm

[sample_stage_position]
front_edge_sample_window_mm =760
# Maximum allowed sample scan length (target length in the UI).
sample_window_length_mm = 550

[scanning_settings]
operation_scanning_speed_mm_per_sec = 80
white_reference_scanning_length_mm = 10
black_reference_frames = 100

[lighthouse]
reflectance_intensity_percent = 100
transmission_intensity_percent = 40

[calibration]
# Spatial scale along the scan axis (mm per detector pixel).
spatial_mm_per_pixel = 0.050
