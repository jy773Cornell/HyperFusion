# HyperFusion hardware configuration
# Edit this file manually. Values are reloaded on every app start.
# Distances are in millimetres unless noted. 

[camera_calibration]
fx10e_spatial_mm_per_pixel = 0.21
swir3_spatial_mm_per_pixel = 0.51
fx10e_spatial_fwhm_mm = 0.982
swir3_spatial_fwhm_mm = 1.1
fx10e_spectral_nm_per_pixel = 1.35
swir3_spectral_nm_per_pixel = 5.6
fx10e_spectral_fwhm_nm = 5.5
swir3_spectral_fwhm_nm = 12
swir3_auto_nuc = true
# SWIR3: column destripe from band-median spatial profile (disables SDK Camera.BPR).
swir3_column_profile_correct = true
swir3_column_profile_baseline_radius = 12
swir3_column_profile_valley_gain_min = 0.88
swir3_column_profile_min_band_dn = 64
swir3_column_profile_min_hits = 1
swir3_column_profile_min_valley_dn = 0

[sample_stage_position]
distance_dual_camera_mm = 165
white_ref_fx10e_mm = 735
white_ref_swir3_mm = white_ref_fx10e_mm - distance_dual_camera_mm
bright_ref_fx10e_mm = 790
bright_ref_swir3_mm = bright_ref_fx10e_mm - distance_dual_camera_mm
sample_scanning_starting_position_fx10e_mm = 840 
sample_scanning_starting_position_swir3_mm = sample_scanning_starting_position_fx10e_mm - distance_dual_camera_mm
temp_stop_position_mm = 400

[scanning_settings]
operation_scanning_speed_mm_per_sec = 80
acceleration_mm_per_sec2 = 30
white_reference_frames = 30
black_reference_frames = 30
black_reference_shutter_settle_ms = 1500
sample_window_max_length_mm = 500
# Exposure (ms) for transmittance scan when both reflectance and transmittance are recorded.
fx10e_transmittance_exp = 19.6
swir_transmittance_exp = 43.5

[lighthouse]
idle_intensity_percent = 0
reflectance_intensity_percent = 100
transmittance_intensity_percent = 48

[preprocessing]
ffc_epsilon = 1e-6
ffc_clamp_min = 0.0
ffc_clamp_max = 1.0
truncate_nm = 780.0
illuminant_d = 65
# SWIR false-color PNG (post-capture): mean reflectance per channel inside each nm range.
swir_false_color_red_nm_min = 1550
swir_false_color_red_nm_max = 1700
swir_false_color_green_nm_min = 1100
swir_false_color_green_nm_max = 1300
swir_false_color_blue_nm_min = 950
swir_false_color_blue_nm_max = 1050

[segmentation]
# GSAM2 sidecar (WSL). sam2_repo_linux empty = auto from resources/gsam2.
wsl_distro = Ubuntu
# Optional extra shell before server start (e.g. export CUDA_VISIBLE_DEVICES=0). Leave empty — app uses ./venv/bin/python.
wsl_bash_command =
sam2_repo_linux =
server_port = 8765
box_threshold = 0.30
multimask_output = false
warmup_on_start = true
hf_model_id = IDEA-Research/grounding-dino-base
sam2_config = configs/sam2.1/sam2.1_hiera_l.yaml
sam2_checkpoint = checkpoints/sam2.1_hiera_large.pt
detector_device = cuda
sam2_device = cuda

[fusion]
# Offline FX10e + SWIR3 fusion. Run hf_fusion/setup_venv.ps1 beside app.exe once.
fusion_margin_mm = 5.0
fusion_timeout_ms = 3600000

[ur3e]
use_ur3e = true
wsl_distro = Ubuntu
wsl_bash_command =
ur3e_repo_linux =
server_port = 8766
robot_ip = 192.168.1.10
reverse_ip = 192.168.1.20
dashboard_port = 29999
rtde_port = 30004
prestart_driver = true
connect_timeout_ms = 120000
ros_distro = jazzy
ur_type = ur3e
use_mock_hardware = false
max_linear_speed_m_per_s = 0.05
max_linear_accel_m_per_s2 = 0.3
# MoveIt joint-space peak speed (deg/s). UR hardware allows up to 190; lower is safer for External Control.
max_joint_velocity_deg_s = 60
# Tool payload collision dome on tool0 (mm radius). Hemisphere mesh on flange.
tool_payload_radius_mm = 50
ceiling_mount_height_mm = 600
# Workspace collision box (mm): X/Y on tray; Z depth extends downward from mount plane.
workspace_boundary_enabled = true
workspace_length_mm = 900
workspace_width_mm = 600
workspace_height_mm = 600
# Mount transform (world -> robot base). Roll=180 = ceiling upside-down. Tune yaw/offsets if RViz != real.
mount_roll_deg = 180
mount_pitch_deg = 0
mount_yaw_deg = 0
mount_offset_x_mm = 0
mount_offset_y_mm = 0
# Scan home pose (degrees): pan, lift, elbow, wrist_1, wrist_2, wrist_3. Mock startup pose, plan IK seed, retreat, execute start/end.
home_joints_deg = 160, 0, -90, 0, 90, 180
