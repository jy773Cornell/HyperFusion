# HyperFusion hardware configuration
# Edit this file manually. Values are reloaded on every app start.
# Distances are in millimetres unless noted. 

[camera_calibration]
fx10e_spatial_mm_per_pixel = 0.21
swir3_spatial_mm_per_pixel = 0.51
fx10e_spatial_fwhm_mm = 0.982
swir3_spatial_fwhm_mm = 1.1
fx10e_spectral_nm_per_pixel = 1.35
swir3_spectral_nm_per_pixel = 5.6
fx10e_spectral_fwhm_nm = 5.5
swir3_spectral_fwhm_nm = 12
swir3_auto_nuc = true
# SWIR3: column destripe from band-median spatial profile (disables SDK Camera.BPR).
swir3_column_profile_correct = false
swir3_column_profile_baseline_radius = 12
swir3_column_profile_valley_gain_min = 0.88
swir3_column_profile_min_band_dn = 64
swir3_column_profile_min_hits = 1
swir3_column_profile_min_valley_dn = 0

[sample_stage_position]
distance_dual_camera_mm = 165
white_ref_fx10e_mm = 735
white_ref_swir3_mm = white_ref_fx10e_mm - distance_dual_camera_mm
bright_ref_fx10e_mm = 790
bright_ref_swir3_mm = bright_ref_fx10e_mm - distance_dual_camera_mm
sample_scanning_starting_position_fx10e_mm = 840 
sample_scanning_starting_position_swir3_mm = sample_scanning_starting_position_fx10e_mm - distance_dual_camera_mm
temp_stop_position_mm = 500
# Apex still (θ=0 look-down). Then stage moves to sample_multiview_position_mm for rings.
sample_multiview_apex_position_mm = 1600
# MVS ring-pin stop. Apex camera JSON is remapped here (sample treated as static).
sample_multiview_position_mm = 1750
# +stage travel in base_link for apex→MVS output translation (x, -x, y, -y).
sample_multiview_stage_axis = x

[scanning_settings]
operation_scanning_speed_mm_per_sec = 80
acceleration_mm_per_sec2 = 30
white_reference_frames = 30
black_reference_frames = 30
black_reference_shutter_settle_ms = 1500
sample_window_max_length_mm = 500
# Exposure (ms) for transmittance scan when both reflectance and transmittance are recorded.
fx10e_transmittance_exp = 20
swir_transmittance_exp = 22

[lighthouse]
idle_intensity_percent = 0
reflectance_intensity_percent = 100
transmittance_intensity_percent = 50

[preprocessing]
ffc_epsilon = 1e-6
ffc_clamp_min = 0.0
ffc_clamp_max = 1.0
truncate_nm = 780.0
illuminant_d = 65
# SWIR3 post-process: residual comb columns from white/dark refs, interpolate, then FFC
swir3_ref_bpr = true
swir3_ref_bpr_baseline_radius = 2
swir3_ref_bpr_white_ratio_min = 0.88
swir3_ref_bpr_white_ratio_max = 1.12
swir3_ref_bpr_dark_abs_min_dn = 40
swir3_ref_bpr_dark_abs_scale = 4
swir3_ref_bpr_column_promote_frac = 0.25
# SWIR false-color PNG (post-capture): mean reflectance per channel inside each nm range.
swir_false_color_red_nm_min = 1300
swir_false_color_red_nm_max = 1400
swir_false_color_green_nm_min = 1050
swir_false_color_green_nm_max = 1150
swir_false_color_blue_nm_min = 980
swir_false_color_blue_nm_max = 1050

[segmentation]
# GSAM2 sidecar (WSL). sam2_repo_linux empty = auto from app/sidecars/gsam2.
wsl_distro = Ubuntu
# Optional extra shell before server start (e.g. export CUDA_VISIBLE_DEVICES=0). Leave empty — app uses ./venv/bin/python.
wsl_bash_command =
sam2_repo_linux =
server_port = 8765
box_threshold = 0.30
multimask_output = false
warmup_on_start = true
hf_model_id = IDEA-Research/grounding-dino-base
sam2_config = configs/sam2.1/sam2.1_hiera_l.yaml
sam2_checkpoint = checkpoints/sam2.1_hiera_large.pt
detector_device = cuda
sam2_device = cuda

[fusion]
# Offline FX10e + SWIR3 fusion. Venv: app/sidecars/hf_fusion/.venv
fusion_margin_mm = 5.0
fusion_timeout_ms = 3600000

[multiview]
use_multiview = true
wsl_distro = Ubuntu
wsl_bash_command =
ur3e_repo_linux =
server_port = 8766
robot_ip = 192.168.1.10
reverse_ip = 192.168.1.20
dashboard_port = 29999
rtde_port = 30004
prestart_driver = true
connect_timeout_ms = 120000
# MoveIt hemisphere Plan HTTP timeout (ms).
plan_timeout_ms = 7200000
ros_distro = jazzy
ur_type = ur3e
use_mock_hardware = false
max_linear_speed_m_per_s = 0.05
max_linear_accel_m_per_s2 = 0.3
# MoveIt joint-space peak speed (deg/s). UR hardware allows up to 190; lower is safer for External Control.
max_joint_velocity_deg_s = 40
# Real BFS tool collision mesh on tool0 (MoveIt). Radius = pinch-guard hemisphere only (flat on flange).
tool_payload_shape = mesh
tool_payload_mesh = bfs_dlp_payload.stl
# Pinch hemisphere radius (mm). Covers most of BFS body for fold checks; mesh still used for MoveIt.
tool_payload_radius_mm = 60
# Optical TCP = BFS camera lens in tool0. Tsai hand-eye (mm + URDF rpy deg).
tool_tcp_x_mm = 0.715
tool_tcp_y_mm = -54.197
tool_tcp_z_mm = 73.755
tool_tcp_roll_deg = -1.9138
tool_tcp_pitch_deg = 0.7450
tool_tcp_yaw_deg = 0.2868
# MoveIt tip. camera = BFS Tsai; dlp = projector lens. Disconnect/Connect after switch.
scan_tcp = dlp
# DLP lens in tool0. Fusion face (−0.372, −57.104, 27.4994) → (−x, −y, z) after mesh pan-180.
# rpy = CAD aligned (position only).
dlp_tcp_x_mm = 0.372
dlp_tcp_y_mm = 57.104
dlp_tcp_z_mm = 27.4994
dlp_tcp_roll_deg = 0
dlp_tcp_pitch_deg = 0
dlp_tcp_yaw_deg = 0
ceiling_mount_height_mm = 870
# Workspace collision box (mm): X/Y on tray; Z depth extends downward from mount plane.
workspace_boundary_enabled = true
workspace_length_mm = 900
workspace_width_mm = 600
workspace_height_mm = 720
# Collision box top is this far below the ceiling mount plane (robot base stays at mount Z).
workspace_ceiling_clearance_mm = 40
# Mount transform (world -> robot base). Roll=180 = ceiling upside-down. Tune yaw/offsets if RViz != real.
mount_roll_deg = 180
mount_pitch_deg = 0
mount_yaw_deg = 0
mount_offset_x_mm = 0
mount_offset_y_mm = 0
# Scan home pose (degrees): pan, lift, elbow, wrist_1, wrist_2, wrist_3. Mock startup pose, plan IK seed, retreat, execute start/end.
home_joints_deg = 90, -180, 145, -55, 90, 90
# Settle before each BFS still
scan_capture_stabilize_ms = 500
# Lock pin-center camera roll. Apex image-up = home facing (no 180° roll vs home).
# Ring pins: image-up = world −Z (camera upside-down, projector on top).
scan_camera_up_world_z = true
# Half-angle tip (deg) in the vertical plane (look-at × camera-up); Plan searches inside→out (±mid, ±half).
pin_pose_tolerance_deg = 5
# TCP look-at tip from the point-at-center ray (deg), baked into TCP rx/ry/rz.
# look_from_nadir ≈ θ − tilt  (ring camera-up is world −Z).
# + = toward camera-up / more look-down. − = toward +Z / more side-look.
# Apex (θ=0) stays exact look-down. Tolerance tips around this axis.
pin_tcp_tilt_deg = 0
# Semi Plan: number of φ candidates per θ ring (evenly spaced over 360°).
semi_ring_search_candidates = 72
# Semi Route combo folder under mvs_semi_scan_plans. Empty = top-level library.
semi_scan_plans_subdir = fpp_scanning
# If a ring has no 360° spin pin, keep the 2 partial-pan pins with max union coverage
# when that union exceeds this many degrees. 0 = disable backup.
semi_backup_coverage_deg = 300
# Save Plan beside app.exe and reload on startup when scan params + robot cfg fingerprint match.
remember_last_scan_plan = true

# BFS OpenCV intrinsics from multiview checkerboard calibration (pixels).
bfs_camera_fx = 1787.820905328422
bfs_camera_fy = 1787.499380533722
bfs_camera_cx = 2084.4011955271963
bfs_camera_cy = 1526.0259879957282
# Brown-Conrady distortion: k1,k2,p1,p2,k3
bfs_camera_distortion = -0.16223465, 0.10156067, 0.0025228506, 0.00068692294, -0.029189458

# DLP3010EVM-LC
dlp_led_max_ma = 2400
dlp_led_red_ma = 2400
dlp_led_green_ma = 2400
dlp_led_blue_ma = 2400
# FPP burst is HDMI 26-frame 1280x720 sine (u then v) on the EVM display.
dlp_hdmi_screen_index = -1
